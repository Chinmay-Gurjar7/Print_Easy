<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - QuickPrint</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body class="auth-page">

<div class="auth-card">

    <a href="/" class="logo">
        <span>QP</span>
        QuickPrint
    </a>

    <h1>Welcome back</h1>

    <p class="muted">
        Login to continue
    </p>


    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
            placeholder="you@example.com"
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
        >


        <button class="primary-button full">
            Login
        </button>

    </form>


    <p id="message"></p>


    <p class="auth-footer">
        Don't have an account?
        <a href="/signup">Create one</a>
    </p>

</div>


<script src="/js/auth.js"></script>

</body>

</html>
